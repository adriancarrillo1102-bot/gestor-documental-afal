<!doctype html><html lang="es"><meta charset="utf-8"><title>AFAL · AFAL</title>
<style>body{margin:0;background:#f4f7f9;color:#17324d;font:15px system-ui}header{padding:14px 22px;background:#17324d;color:white}main{margin:24px}label{display:block;margin:10px 0}input,button{font:inherit;padding:8px}iframe{width:100%;height:84vh;border:1px solid #d7e0e6}iframe[hidden]{display:none}</style>
<header><b>Gestor Documental · AFAL</b> | <a href="../" style="color:white">Volver al Gestor</a></header>
