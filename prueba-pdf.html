<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFAL · Prueba de PDF</title><link rel="stylesheet" href="styles.css"><body><header><h1>Prueba de conversión a PDF</h1><a href="./" style="color:white">Volver al catálogo</a></header><main><section><p id="access" role="status">Comprobando acceso…</p><label for="code">Código documental</label><input id="code" value="GA-PS03-PRO-005"><div class="actions"><button id="probe" disabled>Comprobar convertidor</button><button id="convert" disabled>Generar PDF de consulta</button></div><p id="progress" role="status"></p><pre id="result" style="white-space:pre-wrap"></pre><iframe id="pdf" title="PDF generado" style="width:100%;height:78vh;border:1px solid #ddd" hidden></iframe></section></main><script src="vendor/supabase.js"></script><script type="module">
import {config} from './config.js';import {getPdfPreview} from './pdf-preview.js?v=20261016-1';
const db=window.supabase.createClient(config.url,config.publishableKey),$=id=>document.getElementById(id);let url;
async function run(fn){$('probe').disabled=$('convert').disabled=true;$('result').textContent='';try{await fn()}catch(e){$('progress').textContent='';$('result').textContent=e.message}finally{$('probe').disabled=$('convert').disabled=false}}
$('probe').onclick=()=>run(async()=>{$('progress').textContent='Comprobando acceso y servicio…';const {data,error}=await db.functions.invoke('gd-pdf-preview',{body:{action:'health'}});if(error){let detail;try{detail=await error.context?.json()}catch{}throw Error(detail?.error||detail?.message||error.message)}$('result').textContent=JSON.stringify(data,null,2);$('progress').textContent='Comprobación terminada'});
$('convert').onclick=()=>run(async()=>{const d=await db.from('gd_documents').select('id,code,name').eq('code',$('code').value.trim()).is('deleted_at',null).single();if(d.error)throw d.error;const f=await db.from('gd_files').select('*').eq('document_id',d.data.id).eq('state','ready').order('created_at',{ascending:false}).limit(1).single();if(f.error)throw f.error;const result=await getPdfPreview(db,f.data.id,text=>$('progress').textContent=text);const pdf=await db.storage.from(result.bucket).download(result.path);if(pdf.error)throw pdf.error;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([pdf.data],{type:'application/pdf'}));$('pdf').src=url;$('pdf').hidden=false;$('result').textContent=JSON.stringify({code:d.data.code,source_file_id:f.data.id,source_sha256:f.data.sha256,pdf_bytes:pdf.data.size,cached:result.cached},null,2);$('progress').textContent='PDF generado y vinculado al original'});
try{const {data,error}=await db.auth.getUser();if(error||!data.user)throw Error('Inicia sesión en el catálogo y vuelve a esta página.');const member=await db.rpc('gd_is_member');if(member.error||!member.data)throw Error('Acceso no habilitado');$('access').textContent='Sesión autorizada · '+data.user.email;$('probe').disabled=$('convert').disabled=false}catch(e){$('access').textContent=e.message}
</script></body></html>
