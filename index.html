<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFAL · Gestor documental</title><link rel="stylesheet" href="final.css?v=20261016-final-3"><link rel="stylesheet" href="final-views.css?v=20261016-final-3"><script src="ui-core.js?v=20261016-final-3"></script></head><body>

<header><div class="brand"><img class="afal-logo" src="assets/grupo-afal.png" alt="Grupo AFAL Corporativo"><div><span class="eyebrow">AFAL / GESTIÓN DOCUMENTAL</span><h1><i data-icon="library"></i> Catálogo documental</h1></div></div><div class="header-right"><div class="summary-strip" id="summary" aria-label="Resumen documental"></div><div class="account"><div class="account-line"><span id="roleName" class="role-tag">Administrador</span><button class="quiet" id="logoutDemo">Cerrar sesión <i data-icon="exit"></i></button></div><small id="syncTime">Actualizado hoy</small></div></div></header>
<section id="loginCard" class="login-card"><h2>Acceso al gestor</h2><form id="loginForm"><label for="loginEmail">Correo</label><input id="loginEmail" type="email" autocomplete="username" required><label for="loginPassword">Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required><p id="loginMessage" role="status"></p><button class="primary" id="loginSubmit">Entrar</button></form></section><div id="appShell" hidden><nav class="main-nav" aria-label="Vistas del gestor"><div class="tabs"><button class="tab active" id="catalogTab"><i data-icon="grid"></i> Documentos</button><button class="tab" id="proceduresTab"><i data-icon="flow"></i> Por procedimiento</button><button class="tab" id="statsOpen"><i data-icon="chart"></i> Datos de registro</button></div><div class="nav-actions"><button class="primary" id="newDocument"><i data-icon="plus"></i> Generar registro</button></div></nav>
<main><div class="workspace"><section class="matrix-panel"><div class="panel-heading"><h2 id="matrixTitle"><i data-icon="search"></i> Buscar documentos</h2><div class="heading-actions"><button class="icon-button" id="refreshPreview" aria-label="Actualizar catálogo" title="Actualizar catálogo"><i data-icon="refresh"></i></button><button class="secondary" id="exportCsv"><i data-icon="download"></i> Exportar</button></div></div><div class="search-field"><i data-icon="search"></i><input type="search" id="search" aria-label="Buscar documentos" placeholder="Buscar por nombre, código o responsable…"><kbd>Buscar</kbd></div><div class="filters" id="filters"></div><div class="results-line"><span id="resultCount"></span><button class="text-button" id="clearFilters"><i data-icon="clear"></i> Limpiar filtros</button></div><div class="table-scroll"><table><thead id="tableHead"></thead><tbody id="rows"></tbody></table></div></section>
<aside class="detail-panel" id="detailPanel" aria-label="Detalle del documento"><div class="empty-detail"><i data-icon="file"></i><h2>Selecciona un documento</h2></div></aside></div><section id="procedurePage" class="page-view" hidden><div class="page-heading"><h2><i data-icon="flow"></i> Documentos por procedimiento</h2><span id="procedureResults" class="subtext"></span></div><div class="procedure-toolbar"><div class="search-field"><i data-icon="search"></i><input id="procedureSearch" type="search" aria-label="Buscar procedimiento" placeholder="Buscar procedimiento, código o responsable…"></div><div id="procedureMacroFilter" class="filter-select"></div><div id="procedureSelect" class="filter-select"></div><button class="text-button" id="clearProcedureFilters"><i data-icon="clear"></i> Limpiar filtros</button></div><div class="procedure-workspace"><aside id="procedureData" class="procedure-info"></aside><section id="procedureViewer" class="procedure-reader"><div class="empty-detail"><i data-icon="file"></i><h2>Selecciona un procedimiento</h2></div></section></div></section><section id="statsPage" class="page-view" hidden><div class="page-heading"><h2><i data-icon="chart"></i> Datos de registro</h2><span class="subtext">Catálogo general</span></div><div id="statsBody"></div></section></main></div>
<dialog id="editor" aria-labelledby="editorTitle"><form id="editorForm"><div class="dialog-heading"><h2 id="editorTitle"><i data-icon="plus"></i> Generar registro</h2><button type="button" class="icon-button" data-close="editor" aria-label="Cerrar formulario"><i data-icon="close"></i></button></div><div class="dialog-body"><div class="form-field"><label for="editName">Nombre del documento</label><input id="editName" required maxlength="300" placeholder="Nombre del documento"></div><div id="coincidences" aria-live="polite"></div><div class="form-grid"><div><label for="editMacro">Macroproceso</label><select id="editMacro" required></select></div><div><label for="editType">Tipo documental</label><select id="editType" required></select></div><div><label for="editWave">Ola de implementación</label><select id="editWave"><option value="">Sin registrar</option><option value="1">Ola 1</option><option value="2">Ola 2</option><option value="3">Ola 3</option><option value="4">Ola 4</option><option value="5">Ola 5</option></select></div><div><label for="editVersion">Versión</label><input id="editVersion" maxlength="20"></div><div><label for="editDate">Fecha de emisión</label><input id="editDate" placeholder="AAAA-MM-DD o AAAA-MM" pattern="[0-9]{4}-[0-9]{2}(-[0-9]{2})?"></div><div><label for="editOwner">Responsable</label><input id="editOwner" maxlength="150"></div></div><div class="form-field" id="procedureEditor"><label>Procedimientos relacionados</label><div id="editorProcedures"></div><div class="selected-chips" id="procedureChips"></div></div><div class="form-grid"><div><label for="editRecord">¿Genera registro?</label><select id="editRecord"><option value="">Sin información</option><option value="yes">Sí</option><option value="no">No</option></select></div><div class="record-input"><label for="editPeriod">Periodicidad</label><input id="editPeriod" maxlength="200"></div><div class="record-input"><label for="editRetention">Conservación</label><input id="editRetention" maxlength="200"></div><div class="record-input"><label for="editCustody">Resguardo</label><input id="editCustody" maxlength="300"></div></div><div class="form-field"><label for="editNotes">Palabras clave / notas del documento</label><textarea id="editNotes" maxlength="2000" rows="2"></textarea></div><div><button type="button" class="secondary" id="cancelRecord">Cancelar registro / liberar número</button></div><div id="versionAction" class="version-action"><button type="button" class="secondary" id="editUpload"><i data-icon="upload"></i> Cargar otra versión</button></div><p class="form-error" id="formError" role="alert"></p></div><footer class="dialog-footer"><span class="code-chip" id="nextCode"></span><button type="button" class="secondary" data-close="editor">Cancelar</button><button type="submit" class="primary" id="saveEditor"><i data-icon="check"></i> Guardar datos</button></footer></form></dialog>
<dialog id="uploadDialog" aria-labelledby="uploadTitle"><form id="uploadForm"><div class="dialog-heading"><h2 id="uploadTitle"><i data-icon="upload"></i> Cargar otra versión</h2><button type="button" class="icon-button" data-close="uploadDialog" aria-label="Cerrar carga"><i data-icon="close"></i></button></div><div class="dialog-body"><p class="code-chip" id="uploadCode"></p><label class="drop-zone" for="uploadFile"><i data-icon="upload"></i><strong id="originalLabel">Archivo original</strong><input id="uploadFile" type="file" required></label><div id="pdfPairFields" hidden><label for="existingSource">Original ya cargado de esta versión</label><select id="existingSource"><option value="">Cargar un original nuevo</option></select><label for="consultationFile">PDF final de consulta</label><input id="consultationFile" type="file" accept="application/pdf,.pdf"></div><label for="uploadVersion">Versión</label><input id="uploadVersion" required maxlength="20"></div><footer class="dialog-footer"><span id="uploadProgress" role="status"></span><button type="button" class="secondary" data-close="uploadDialog">Cancelar</button><button id="uploadSubmit" class="primary" type="submit">Cargar archivos</button></footer></form></dialog>
<dialog class="wide-dialog" id="procedureDialog" aria-labelledby="procedureTitle"><div class="dialog-heading"><div><span class="eyebrow dark" id="procedureCode"></span><h2 id="procedureTitle"></h2></div><button class="icon-button" data-close="procedureDialog" aria-label="Cerrar procedimiento"><i data-icon="close"></i></button></div><div class="dialog-body" id="procedureBody"></div></dialog>
<dialog class="wide-dialog" id="fileDialog"><div class="dialog-heading"><h2 id="fileTitle"></h2><button class="icon-button" data-close="fileDialog" aria-label="Cerrar archivo"><i data-icon="close"></i></button></div><div class="dialog-body" id="fileBody"></div></dialog><div id="toast" role="status" hidden></div><script src="vendor/supabase.js"></script><script type="module" src="final-app.js?v=20261016-final-3"></script></body></html>
