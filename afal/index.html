<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFAL · Gestor Documental</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f9;color:#17324d;font:14px system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;min-height:46px;padding:6px 18px;background:#17324d;color:white}
.back{color:white;text-decoration:none;font-weight:600}
.back:hover{text-decoration:underline}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.actions details{position:relative}
.actions summary,.actions>button{cursor:pointer;color:white;background:#254864;border:1px solid #587087;border-radius:6px;padding:5px 9px;font:inherit}
.actions details[open]{z-index:2}
.actions .panel{position:absolute;top:calc(100% + 8px);right:0;width:min(300px,calc(100vw - 36px));padding:14px;background:white;color:#17324d;border:1px solid #d7e0e6;border-radius:8px;box-shadow:0 8px 24px #17324d26}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#login{width:min(380px,calc(100% - 32px));margin:28px auto 8px;padding:20px;background:white;border:1px solid #d7e0e6;border-radius:10px}
#status{margin:8px auto;padding:0 12px}
main:has(iframe:not([hidden])) #status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);padding:0;margin:0}
label{display:block;margin:8px 0}
label small{display:block;margin-top:4px;color:#435d73}
input:not([type=checkbox]),select{width:100%;margin-top:4px}
input,button,select{font:inherit;padding:6px}
iframe{width:100%;flex:1;min-height:0;border:0}
body:has(iframe:not([hidden])){height:100dvh;overflow:hidden}
@media(max-width:600px){header{padding:6px 10px}.actions details{position:static}.actions .panel{top:auto;right:10px;margin-top:6px}}
</style>
<header><a class="back" href="../">← Volver al Gestor</a><div class="actions"><button id="exit" hidden>Cerrar sesión</button><details id="account" hidden><summary>Mi cuenta</summary><div class="panel"><p id="identity"></p><form id="changePassword"><label>Nueva contraseña <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><button>Cambiar mi contraseña</button></form><p role="status"></p></div></details><details id="accounts" hidden><summary>Crear usuario AFAL</summary><div class="panel"><form id="createAccount"><label>Usuario <input name="username" autocomplete="off" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9][a-zA-Z0-9._\-]{2,31}"></label><label>Perfil <select name="role"><option value="viewer">Consultante</option><option value="admin">Administrador</option></select></label><label>Contraseña inicial <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><label><input id="showInitial" type="checkbox"> Mostrar contraseña inicial</label><button>Crear cuenta</button></form><p role="status"></p></div></details></div></header>
<main><form id="login"><p>Acceso con tu cuenta de AFAL o del Gestor.</p><label>Usuario <input name="identifier" autocomplete="username" required><small>Para la cuenta general del Gestor, usa tu correo habitual.</small></label><label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="status" role="status"></p><iframe id="module" title="AFAL" hidden></iframe></main>
<script src="../vendor/supabase.js"></script><script type="module" src="trial.js?v=20261107-personas-compacto-2"></script></html>
